<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Bridgify Mockup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: owner app shell (sidebar + content), project header with tabs, client-facing screens without shell. */
:root{
  --bg:#F3F5F6; --surface:#FFFFFF; --sunk:#EAEEF0; --ink:#14212B; --muted:#5A6874; --faint:#8794A0; --line:#DCE2E6;
  --accent:#0B6873; --accent-ink:#FFFFFF; --accent-soft:#DDEFF0;
  --ok:#1D7348; --ok-soft:#DFF1E6; --warn:#9A5B00; --warn-soft:#FBEBD0; --crit:#B3261E; --crit-soft:#FBE1DE; --info:#2557A7; --info-soft:#E1EAF8; --neutral-soft:#E9ECEE;
  --bot:#0B6873; --bubble-in:#E9E9EB; --bubble-out:#1A7CF5; --note:#FFF7D6; --note-ink:#5C4A00; --note-line:#E8D58A;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F161B; --surface:#172129; --sunk:#111A20; --ink:#E4EAEE; --muted:#9AA8B3; --faint:#6E7C87; --line:#2A3740;
  --accent:#4FB7C1; --accent-ink:#06262A; --accent-soft:#16363A;
  --ok:#6BCB95; --ok-soft:#173528; --warn:#E7B060; --warn-soft:#3A2B13; --crit:#F08A80; --crit-soft:#3D1D1B; --info:#8CB2F0; --info-soft:#1B2A44; --neutral-soft:#24303A;
  --bot:#4FB7C1; --bubble-in:#2A3138; --bubble-out:#1A6FD8; --note:#2E2A16; --note-ink:#E9D98F; --note-line:#5B5126; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F161B; --surface:#172129; --sunk:#111A20; --ink:#E4EAEE; --muted:#9AA8B3; --faint:#6E7C87; --line:#2A3740;
  --accent:#4FB7C1; --accent-ink:#06262A; --accent-soft:#16363A;
  --ok:#6BCB95; --ok-soft:#173528; --warn:#E7B060; --warn-soft:#3A2B13; --crit:#F08A80; --crit-soft:#3D1D1B; --info:#8CB2F0; --info-soft:#1B2A44; --neutral-soft:#24303A;
  --bot:#4FB7C1; --bubble-in:#2A3138; --bubble-out:#1A6FD8; --note:#2E2A16; --note-ink:#E9D98F; --note-line:#5B5126; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5}
h1,h2,h3{font-family:var(--display);font-weight:650;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.6rem;line-height:1.2} h2{font-size:1.12rem} h3{font-size:.98rem}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:.86em}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

/* mockup chrome */
.mockbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--ink);color:var(--bg);display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:.8rem}
.mockbar b{font-family:var(--display);font-size:.9rem;letter-spacing:0}
.mockbar label{display:flex;gap:6px;align-items:center}
.mockbar select{background:transparent;border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);color:var(--bg);border-radius:6px;padding:3px 6px;max-width:220px}
.mockbar select option{color:#14212B;background:#fff}
.mockbar .sp{flex:1}

/* app shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100vh - 40px)}
.side{border-right:1px solid var(--line);background:var(--surface);padding:18px 12px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand-mark{width:30px;height:30px;border-radius:7px;background:var(--accent);display:grid;place-items:center}
.brand-mark svg{display:block}
.brand-name{font-family:var(--display);font-size:1.2rem;font-weight:650}
.org{padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;font-size:.8rem}
.org strong{font-size:.86rem}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:6px;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--sunk);color:var(--ink)}
.nav button.on{background:var(--accent-soft);color:var(--ink)}
.nav button:focus-visible{outline:2px solid var(--accent)}
.count{font-size:.72rem;min-width:20px;text-align:center;border-radius:10px;padding:1px 6px;background:var(--neutral-soft);color:var(--muted);font-variant-numeric:tabular-nums}
.count.hot{background:var(--warn-soft);color:var(--warn);font-weight:600}
.side-foot{margin-top:auto;font-size:.76rem;color:var(--muted);padding:0 8px;display:flex;flex-direction:column;gap:6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px}
.dot.warn{background:var(--warn)} .dot.crit{background:var(--crit)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--surface);
  padding-block:10px;padding-left:24px;padding-right:24px}
.crumbs{font-size:.84rem;color:var(--muted)} .crumbs b{color:var(--ink);font-weight:600}
.health{display:flex;gap:14px;font-size:.78rem;color:var(--muted);flex-wrap:wrap;align-items:center}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:.74rem}
.content{padding:24px;display:flex;flex-direction:column;gap:20px;max-width:1280px;width:100%}

/* project header */
.phead{background:var(--surface);border-bottom:1px solid var(--line);padding:18px 24px 0;display:flex;flex-direction:column;gap:12px}
.phead-row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.phead-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:.84rem;color:var(--muted)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs button{all:unset;cursor:pointer;padding:9px 12px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--accent)}
.tabs button:hover{color:var(--ink)}
.tabs button:focus-visible{outline:2px solid var(--accent)}
.subtabs{display:flex;gap:6px;flex-wrap:wrap}
.subtabs button{all:unset;cursor:pointer;padding:5px 12px;border-radius:20px;border:1px solid var(--line);font-size:.84rem;color:var(--muted);background:var(--surface)}
.subtabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.subtabs button:focus-visible{outline:2px solid var(--accent)}

/* generic */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-h p{font-size:.8rem;color:var(--muted)}
.panel-b{padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;cursor:pointer;text-align:left}
.tile:hover{border-color:var(--accent)}
.tile .big{font-family:var(--display);font-size:1.9rem;font-weight:650;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .lbl{font-size:.82rem;color:var(--muted)}
.tile.warn .big{color:var(--warn)} .tile.crit .big{color:var(--crit)}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;font-weight:500;cursor:pointer;font-size:.86rem;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,var(--line))}
.btn.sm{padding:3px 9px;font-size:.8rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap}

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:1px 9px;font-size:.76rem;font-weight:500;white-space:nowrap;background:var(--neutral-soft);color:var(--muted)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)} .pill.info{background:var(--info-soft);color:var(--info)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.code{font-family:var(--mono);font-size:.74rem;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted);white-space:nowrap}
.pri-tag{font-family:var(--mono);font-size:.7rem;font-weight:500;border-radius:4px;padding:1px 5px;background:var(--ink);color:var(--bg)}
.pri-tag.p1{background:var(--muted)}

.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th{text-align:left;font-weight:600;font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunk)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
tr.sel td{background:var(--accent-soft)}
tbody tr:last-child td{border-bottom:none}
.tfoot{display:flex;justify-content:space-between;padding:10px 12px;font-size:.78rem;color:var(--muted);border-top:1px solid var(--line);flex-wrap:wrap;gap:8px}

.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;padding:12px 16px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:none}
.li-main{display:flex;flex-direction:column;gap:3px;min-width:0}
.li-main .t{font-weight:500}
.li-main .s{font-size:.8rem;color:var(--muted)}
.li-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.stripe{border-left:3px solid var(--warn)} .stripe.crit{border-left-color:var(--crit)} .stripe.info{border-left-color:var(--info)}

.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 14px;border-radius:var(--r);border:1px solid;font-size:.86rem}
.banner.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent);color:var(--ink)}
.banner.crit{background:var(--crit-soft);border-color:color-mix(in srgb,var(--crit) 35%,transparent);color:var(--ink)}
.banner.info{background:var(--info-soft);border-color:color-mix(in srgb,var(--info) 30%,transparent);color:var(--ink)}

.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:7px 18px;font-size:.86rem}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.quote{border-left:3px solid var(--line);padding:8px 12px;background:var(--sunk);border-radius:0 6px 6px 0;font-size:.88rem}
.quote cite{display:block;font-style:normal;font-size:.74rem;color:var(--muted);margin-top:4px}
.quote.client{border-left-color:var(--info)} .quote.agree{border-left-color:var(--accent)}
.private{background:var(--note);border:1px dashed var(--note-line);color:var(--note-ink);border-radius:6px;padding:10px 12px;font-size:.86rem}
.private .eyebrow{color:var(--note-ink)}
.preview-msg{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.88rem}

.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:.8rem;font-weight:600}
.field .hint{font-size:.76rem;color:var(--muted)}
.input,select.input,textarea.input{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 10px;width:100%}
textarea.input{resize:vertical;min-height:72px}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:none}
.check input{margin-top:3px;accent-color:var(--accent)}
.check .t{font-weight:500} .check .s{font-size:.8rem;color:var(--muted)}
.check.disabled{opacity:.6}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:5px 12px;font-size:.84rem;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg)}

.meter{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--sunk);border:1px solid var(--line)}
.meter span{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.money{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;font-size:.9rem}
.money .tot{font-weight:600;border-top:1px solid var(--line);padding-top:6px}

/* build notes */
.notes{background:var(--note);border:1px solid var(--note-line);color:var(--note-ink);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:.84rem}
.notes .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.notes ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.notes .code{background:transparent;border-color:var(--note-line);color:var(--note-ink)}
.notes summary{cursor:pointer;font-weight:600}

/* states */
.state{border:1px dashed var(--line);border-radius:var(--r);padding:40px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;background:var(--surface)}
.skel{height:14px;border-radius:4px;background:linear-gradient(90deg,var(--sunk),var(--line),var(--sunk));background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}

/* drawer */
.scrim{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 35%,transparent);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:41;overflow-y:auto;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:18px 20px;border-bottom:1px solid var(--line)}
.drawer-b{padding:18px 20px;display:flex;flex-direction:column;gap:18px}
.sec{display:flex;flex-direction:column;gap:8px}

/* conversation */
.thread{display:flex;flex-direction:column;gap:2px;padding:16px}
.msg{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:12px;padding:10px 12px;border-radius:8px;align-items:start}
.msg.bot{background:var(--accent-soft)}
.msg.owner{background:var(--sunk)}
.msg .who{font-weight:600;font-size:.84rem}
.msg .who small{display:block;font-weight:400;color:var(--muted);font-size:.74rem}
.msg .body{white-space:pre-line}
.msg .meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:.74rem;color:var(--muted)}
.daysep{text-align:center;font-size:.74rem;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.08em}

/* timeline */
.tl{display:flex;flex-direction:column;padding:8px 16px}
.tl-i{display:grid;grid-template-columns:92px 14px minmax(0,1fr);gap:12px;padding:10px 0}
.tl-i .time{font-size:.78rem;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.tl-i .rail{position:relative}
.tl-i .rail::before{content:"";position:absolute;left:6px;top:0;bottom:-20px;width:2px;background:var(--line)}
.tl-i .rail i{position:absolute;left:1px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.tl-i:last-child .rail::before{display:none}

/* stepper */
.stepper{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.step{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-top:3px solid var(--line);font-size:.82rem;color:var(--muted)}
.step b{color:var(--ink);font-weight:600}
.step.done{border-color:var(--ok)} .step.on{border-color:var(--accent)}
.step:focus-visible{outline:2px solid var(--accent)}

/* board */
.board{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:12px;overflow-x:auto;padding-bottom:4px}
.col{background:var(--sunk);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:200px}
.col h3{font-size:.82rem;display:flex;justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:.84rem;cursor:pointer}
.card.ghost{border-style:dashed;cursor:default;background:transparent}

/* client + login */
.center{min-height:calc(100vh - 40px);display:flex;justify-content:center;align-items:flex-start;padding-block:48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.auth{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px;display:flex;flex-direction:column;gap:16px}
.client{width:min(720px,100%);display:flex;flex-direction:column;gap:18px}
.client .doc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px;display:flex;flex-direction:column;gap:20px}
.modal{position:fixed;inset:0;display:grid;place-items:center;z-index:50;background:color-mix(in srgb,var(--ink) 40%,transparent);padding:16px}
.modal .box{background:var(--surface);border-radius:12px;padding:24px;width:min(460px,100%);display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}

/* phone */
.phone-wrap{display:flex;gap:28px;flex-wrap:wrap;justify-content:center;padding-block:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.phone{width:min(360px,100%);border-radius:38px;border:10px solid #1B1F23;background:#fff;color:#111;display:flex;flex-direction:column;height:720px;overflow:hidden}
.phone-top{padding:14px 16px 10px;text-align:center;border-bottom:1px solid #e5e5ea;background:#f7f7f9}
.phone-top .gname{font-weight:600;font-size:.86rem}
.phone-top .gsub{font-size:.7rem;color:#8a8a8e}
.phone-body{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px;font-family:-apple-system,"Helvetica Neue",var(--body);font-size:.86rem}
.bub{max-width:78%;padding:7px 11px;border-radius:17px;line-height:1.35;white-space:pre-line}
.bub.in{background:#E9E9EB;color:#111;align-self:flex-start;border-bottom-left-radius:5px}
.bub.botb{background:#E9E9EB;color:#111;align-self:flex-start;border-bottom-left-radius:5px;border:1.5px solid #0B6873}

    <p class="muted">An ordinary iMessage group. The assistant posts from its own Photon identity. Private owner prompts, pricing notes and internal tasks never appear here.</p>
    <div class="list panel">${[["Auto-accepted","R-1, R-2"],["Clarified","R-4"],["Escalated, acknowledged once","R-3, R-5–R-9, R-11"],["Chat “yes” → approval link","P-001"],["No reply","thanks, prompt injection, unknown sender"]].map(([a,b])=>`<div class="li"><span>${a}</span><span class="mono faint">${b}</span></div>`).join("")}</div>
    <button class="btn" data-go="p-conversation" style="align-self:flex-start">Open dashboard evidence view</button></div>
  <div class="phone"><div class="phone-top"><div class="gname">Harbor & Pine × Website</div><div class="gsub">Maya, Amogh, Bridgify, +1 (415)…</div></div>
    <div class="phone-body">${(()=>{let out="",prev="",day="";CONVO.forEach(m=>{if(m.day){out+=`<div class="ptime">${m.day.replace("day,","")}</div>`;prev="";return;}
      const cls=m.bot?"botb":"in"; if(m.who!==prev) out+=`<div class="bname ${m.bot?"botn":""}">${m.bot?"Bridgify (assistant)":m.who}</div>`; prev=m.who;
      out+=`<div class="bub ${cls}">${m.text}</div>`; if(m.del==="unknown") out+=`<div class="bname" style="color:#B3261E">Not confirmed delivered</div>`;});return out;})()}</div>
    <div class="phone-in"><span>iMessage</span></div></div></div>`;
}

/* ---------------- router ---------------- */
function render(){
  const r=S.route; let html="";
  const pmap={"p-overview":["overview",pageOverview],"p-work":["work",()=>pageWork(false)],"p-requests":["requests",pageRequests],"p-scope":["scope",pageScope],"p-proposals":["proposals",()=>pageProposals(false)],"p-editor":["proposals",pageEditor],"p-conversation":["conversation",pageConversation],"p-activity":["activity",pageActivity],"p-automation":["automation",pageAutomation]};
  const crumbP=t=>`<span>Projects</span> / <b>Harbor & Pine Bakery</b> / ${t}`;
  if(r==="login") html=pageLogin();
  else if(r==="client") html=pageClient();
  else if(r==="imessage") html=pageIMessage();
  else if(pmap[r]) { const [tab,fn]=pmap[r]; html=shell("projects", projectHead(tab)+fn(), crumbP(tab)); }
  else {
    const g={home:["home",pageHome,"<b>Home</b>"],projects:["projects",pageProjects,"<b>Projects</b>"],tasks:["tasks",()=>pageWork(true),"<b>Actionable Tasks</b>"],decisions:["decisions",pageDecisions,"<b>Needs Attention</b>"],proposals:["proposals",()=>pageProposals(true),"<b>Proposals</b>"],settings:["settings",pageSettings,"<b>Settings</b>"],setup:["projects",pageSetup,"Projects / <b>New project</b>"]}[r]||["home",pageHome,"<b>Home</b>"];
    html=shell(g[0], g[1](), `Northlight Web Studio / ${g[2]}`);
  }
  $("#root").innerHTML = html + (S.drawer?drawer():"");
  $("#jump").value=r;
}
function go(r){ S.route=r; S.drawer=null; S.clientConfirm=false; try{history.replaceState(null,"","#"+r)}catch(e){location.hash=r} render(); window.scrollTo(0,0); }

$("#jump").innerHTML = SCREENS.map(([g,items])=>`<optgroup label="${g}">${items.map(([k,t])=>`<option value="${k}">${t}</option>`).join("")}</optgroup>`).join("");
$("#jump").addEventListener("change",e=>go(e.target.value));
$("#vstate").addEventListener("change",e=>{S.view=e.target.value;render()});
$("#notesToggle").addEventListener("change",e=>{S.notes=e.target.checked;try{localStorage.setItem("bfy-notes",S.notes?"1":"0")}catch(_){};render()});
try{ if(localStorage.getItem("bfy-notes")==="0"){S.notes=false;$("#notesToggle").checked=false} }catch(_){}

document.addEventListener("click",e=>{
  const set=e.target.closest("[data-set]"), g=e.target.closest("[data-go]"), dr=e.target.closest("[data-drawer]"), cl=e.target.closest("[data-close]");
  if(cl){ S.drawer=null; render(); return; }
  if(set){ const [k,v]=set.dataset.set.split(":"); S[k]= (k==="step")?Number(v):(k==="clientConfirm")?v==="1":v; if(k==="clientState") S.clientConfirm=false; }
  if(g){ e.preventDefault(); const keepDec=S.dec; go(g.dataset.go); if(set) {render();} return; }
  if(dr){ S.drawer=dr.dataset.drawer; render(); return; }
  if(set) render();
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&(S.drawer||S.clientConfirm)){S.drawer=null;S.clientConfirm=false;render();} });

const valid=SCREENS.flatMap(([,i])=>i.map(x=>x[0]));
const h=(location.hash||"").slice(1); S.route=valid.includes(h)?h:"home";
render();
</script>
